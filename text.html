<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Generation - NewGenerationAI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>NewGenerationAI</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="image.html">Image Generation</a></li>
                    <li><a href="text.html">Text Generation</a></li>
                    <li><a href="audio.html">Audio Generation</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        <div class="container" id="text-generation-page">
            <h2>Text Generation</h2>
            <form id="text-form">
                <div class="form-group">
                    <label for="text-prompt">Prompt:</label>
                    <textarea id="text-prompt" name="prompt" rows="5" required>Tell me a short story about a brave robot.</textarea>
                </div>

                <div class="form-group">
                    <label for="text-model">Model:</label>
                    <select id="text-model" name="model"></select>
                </div>

                <!-- Optional: Checkbox for OpenAI compatible endpoint (future enhancement) -->
                <!--
                <div class="form-group">
                    <input type="checkbox" id="text-openai-compatible" name="openai_compatible">
                    <label for="text-openai-compatible">Use OpenAI Compatible Endpoint (Requires different prompt structure if true)</label>
                </div>
                -->

                <button type="submit" id="generate-text-btn">Generate Text</button>
            </form>

            <div id="text-output-area" class="output-area">
                <p id="text-loading" class="hidden">Generating your text...</p>
                <div id="generated-text-content"></div>
                <div id="text-error" class="error-message hidden"></div>
            </div>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2024 NewGenerationAI</p>
        </div>
    </footer>
    <script src="js/main.js"></script>
    <script src="js/text.js"></script>
</body>
</html>
